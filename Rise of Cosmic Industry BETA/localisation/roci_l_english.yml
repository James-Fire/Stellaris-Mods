		roci_civic_autofab_megacorp_desc: "$roci_civic_autofab_desc$"
		
		ap_autofab:0 "Automation Revolution"
		ap_autofab_desc:0 "Our society has progressed to the point where our population expects certain things, and are unwilling to do it themselves. Automated Factories can handle the required tasks."
		
		can_use_autofab:0 "Unlock the ability to build Automated Factories on your planets, reducing your reliance on labour from people and machines. \nIf you have an Automatic Factory Origin or Civic, this makes the Automatic Factory give §G+30%§! automated workforce efficiency instead."
		
