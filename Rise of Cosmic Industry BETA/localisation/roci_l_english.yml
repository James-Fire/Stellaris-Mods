	#Events
 
		kiyo_trade_orbit_event.1.title:0 "External Trade Route Setup Complete"
		kiyo_trade_orbit_event.1.desc:0 "Our empire has finished setting up a foreign trade route between $PLANET_1|Y$ and $PLANET_2|Y$. Our cargo fleet will now send cargo to those planets based on the pops in each of those planets."
		
		kiyo_trade_orbit_event.12.title:0 "Trade Route from §Y[kiyo_trade_trader.GetName]§!"
		kiyo_trade_orbit_event.12.desc:0 "Another empire has started a foreign trade route with one of our planets ($PLANET_2|Y$ in the $SOLAR_SYSTEM|Y$ system)."
		
		kiyo_trade_triggered_event.9.title:0 "Cancelled Trade Route"
		kiyo_trade_triggered_event.9.desc:0 "Our trade route from the §Y[Root.GetName]§! was cancelled.\n\nIf the trade route was fully set up, then strained relations with your trade partner or a planet being devastated can cause this to happen. Otherwise, you may have done something really weird, like disbanding an individual cargo ship (which only harms you)."
		
		cancel_route: "Cancel Trade Route"
		
		roci_trade_cap_increased_message: "Our trade route cap and trade route size cap have increased to [this.kiyo_trade_max_trade_routes] and [this.kiyo_trade_max_cargo_ships_per_fleet], respectively."
		
	#Tooltips
		roci_trade_routes_opinion: "The partner empire must either have 50 opinion of us, or 25 and one of us is improving relations."
		roci_trade_routes_subject: "One Empire must be a subject of the other."
		roci_trade_routes_federation: "Both countries must be in the same Federation."
		cargo_fleet_maxxed: "This Cargo Fleet already has the max number of ships"
		
		#Concepts
		concept_trade_penalty: "Trade Income Penalty"
		concept_trade_penalty_desc: "This is a 10% multiplicative penalty. Each trade route over our limit decreases our trade income by 10% of the remaining amount. So 1 over would give -10%, 2 would give -19% (10% for the first, 9% as 10% of 90% for the second), and so on."
		
###Exodus Fleet
		
		exodus_governing: "Exodus Support"
		exodus_governing_desc: "The people support the Exodus from the homeworld, and will continue to do so as long as promises of a 'better society' continue to be filled."
		
		b_exodus_stasis: "Stasis Pods"
		b_exodus_stasis_desc: "We still have people in stasis from our Exodus. We should work on expanding our living space and support infrastructure to bring them out as soon as possible."
		b_exodus_stasis_effect_tooltip: "§Y100§! £pop£ Pops are created"
		
		roci_origin_exodus_fleet: "Exodus Fleet"
		roci_origin_exodus_fleet_desc: "A mysterious figure from the fractured homeworld offered to take anyone willing to a new planet to build a better society, enough people signed up, but with a lack of construction ability, it might be a while before everyone gets to come out of stasis.\nThey chose a resource-rich system, with 2 good planets to settle in, which should help kickstart the new society."		
		roci_origin_exodus_fleet_effects: "- $roci_origin_exodus_fleet_effects_1$ \n- $roci_origin_exodus_fleet_effects_2$ \n- $roci_origin_exodus_fleet_effects_3$ \n- $roci_origin_exodus_fleet_effects_4$ \n- $roci_origin_exodus_fleet_effects_5$\n- $roci_origin_exodus_fleet_effects_6$\n\n"
		
		roci_origin_exodus_fleet_effects_1: "Starts with a Chosen One ruler, who is also Level 5 and starts with Charismatic lvl2."
		roci_origin_exodus_fleet_effects_2: "Start with a size £planetsize£ §Y30§! gaia world, with §Y2-3§! §Gpositive§! modifiers, rich in resources."
		roci_origin_exodus_fleet_effects_3: "Your new home system is rich in deposits, and contains a size £planetsize£ §Y20§! planet of your ideal planet class, with §Y1-2§! §Gpositive§! modifiers."
		roci_origin_exodus_fleet_effects_4: "You start with very few £pop£ pops. Robots and some Autofab Automation make up a large portion of your starting prodution. You can bring more £pop£ pops out of stasis by clearing the blockers."
		roci_origin_exodus_fleet_effects_5: "Start with a selection of extra techs, including blocker clearing tech based on the climate of your homeworld."
		roci_origin_exodus_fleet_effects_6: "Start with no mining or research stations, and no Orbital Infrastructure. Your home planet has some bare-bones infrastructure."
		roci_origin_exodus_fleet_effects_7: "A large Governing Ethics Attraction boost. Also a temporary Governing Ethics Attraction and Happiness boost, that decays over time. It takes longer to decay, and can even stop decaying after a certain amount, the happier your people are."
		
		exodus_system_NAME: "Single Star Exodus"
		exodus_system_DESC: "A starting system with a single star.\n\nThese Exodus systems are currently setup with the exact same resources, with the number of stars being entirely cosmetic."
		binary_exodus_system_NAME: "Binary Star Exodus"
		binary_exodus_system_DESC: "A starting system with two stars.\n\nThese Exodus systems are currently setup with the exact same resources, with the number of stars being entirely cosmetic."
		trinary_exodus_system_NAME: "Trinary Star Exodus"
		trinary_exodus_system_DESC: "A starting system with three stars.\n\nThese Exodus systems are currently setup with the exact same resources, with the number of stars being entirely cosmetic."
		
	 #Homeworld events
		exodus_fleet.20.name: "From Another Galaxy"
		exodus_fleet.20.desc: "Our trip through the void was long, but we're here, far beyond the reach of the homeworld. We can start our new life free from their interference."
		
		exodus_fleet.21.name: "From This Galaxy"
		exodus_fleet.21.desc: "We have escaped the immediate reach of the homeworld. Whatever happens to them is no longer our concern, for the moment. If they survive, we may meet them later. We should be prepared for that."
		
		exodus_fleet.22.name: "Found The Homeworld"
		exodus_fleet.22.desc: "We have found the homeworld, but it's abandoned and lifeless. Something happened to cause total societal collapse after we left. Disease, famine, natural disasters, we may never know. At least we can put the ruins to good use."
		exodus_fleet.22.option: "Maybe we can find out what happened to them."
		
		exodus_fleet.23.name: "Found The Homeworld"
		exodus_fleet.23.desc: "It seems that nuclear war erupted sometime after we left. Not much is left of our forefathers' civilization, and maybe that's a good thing."
		exodus_fleet.23.option: "Seems we were right to leave."
		
		exodus_fleet.24.name: "Met The Homeworld"
		exodus_fleet.24.desc: "The homeworld survived our exodus, and are just the same as ever. All the problems with how they do things are still there, and the reason we left. We will not get along."
		exodus_fleet.24.option: "We'll have to deal with them."
		
		exodus_fleet.25.name: "Met The Homeworld"
		exodus_fleet.25.desc: "The homeworld survived the exodus, but was hit by a revolution sometime after. They've changed, so maybe we'll be able to get along now."
		exodus_fleet.25.option: "Perhaps we can be friends?"
		
###General ROCI

	#UI stuffs
		roci_menu.2.name: "Rise Of Cosmic Industry Settings"
		roci_menu.2.desc: ""
		roci_menu.2.confirm: "Confirm"
 
		roci_settings_desc: "This is the Rise Of Cosmic Industry Game Start settings menu. You can disable specific modules of ROCI here, or change module-specific settings. Each setting has a short tooltip giving some context to what it does."
 
		roci_autofab: "Automatic Factory"
		roci_autofab_everyone: "Factory For All"
		roci_autofab_everyone_desc: "This setting allows you to make the Factory available to everyone, regardless of Origin, Civic, or AP. The Origin and Civic still start with some built, this setting does not."
		roci_autofab_desc: "The Automatic Factory module provides the ['concept_autofab'], a mechanic you can use to produce resources without pops. It has Planet and Empire UI, accessible from a decision and edict respectively. Requires the Origin, Civic, or AP, or the Factory For All setting enabled."
		
		roci_exploit: "Space Exploitation"
		roci_exploit_desc: "The Space Exploitation module provides ['concept_minor_colony'], a mechanic you can use to build more resource production on uninhabitable planets for collection by Mining or Research stations. It has an Empire level UI, accessible from an edict."
		roci_exploit_disabled: "Space Exploitation is disabled pending a rework so it doesn't clash with 3.9 Habitats."
		roci_exploit_uninhabitables_size: "Uninhabitable Sizes"
		roci_exploit_uninhabitables_size_desc: "When a planet has a valid terrform available, it shows the planet size. This setting controls terraform options for all Uninhabitable Planets, so that their size can be shown. A side effect of this is that they will always show as having a terraform option available.\n\nThis option is placed under Space Exploitation, but it can be toggled even if Space Exploitation is off."
		roci_exploit_starting_loops: "Starting Loops"
		roci_exploit_starting_loops_desc: "Whether the starting ['concept_minor_colony'] start with a loop that continues building more constructions."
		
		roci_orbital: "Orbital Infrastructure"
		roci_orbital_desc: "The Orbital Infrastructure module provides ['concept_orbital_districts'], a mechanic to increase a planet's production without increasing pop count. It has districts and a building: The Spaceport."
		roci_orbital_ring: "Planetary Ring Overwrite"
		roci_orbital_ring_desc: "The planetary ring from Overlord can be overwritten to be able to be placed on all habitable planets. This setting can be toggled separately from the Orbital Infrastructure module."
		roci_orbital_infra_disabled: "Orbital Infrastructure is disabled pending a rework for 4.0"
	 
		roci_realdev: "Realistic Development"
		roci_realdev_desc: "The Realistic Development module provides ['concept_industrial_production'], a mechanic to simulate limited industrial ability, and your distribution of it. It has an Empire level UI, accessible from an edict, and a Situation giving a good overview of current status."
		roci_realdev_build_adjustment_desc: "This setting controls the strength of the ['concept_realism_adjustment']. A higher adjustment will lead to longer games, as it takes longer to build up."
		roci_realdev_build_adjustment_swap_desc: "This setting controls the strength of the ['concept_realism_adjustment']. A higher adjustment will lead to longer games, as it takes longer to build up."
		roci_realdev_build_adjustment_none: "Adjustment: None"
		roci_realdev_build_adjustment_none_desc: "There is no adjustment provided. Any Industrial Production allocated is extra."
		roci_realdev_build_adjustment_small: "Adjustment: Small"
		roci_realdev_build_adjustment_small_desc: "There is a -25% adjustment provided. A flat -25% malus, requiring somewhat realistic amounts of Industrial Production."
		roci_realdev_build_adjustment_medium: "Adjustment: Medium"
		roci_realdev_build_adjustment_medium_desc: "There is a -50% adjustment provided. A flat -50% malus, requiring more realistic amounts of Industrial Production."
		roci_realdev_build_adjustment_large: "Adjustment: Large"
		roci_realdev_build_adjustment_large_desc: "There is a -75% adjustment provided. A flat -75% malus, requiring close to realistic amounts of Industrial Production."
		roci_realdev_build_adjustment_full: "Adjustment: Full"
		roci_realdev_build_adjustment_full_desc: "There is a -100% adjustment provided. A flat -100% malus, requiring fully realistic amounts of Industrial Production."
		roci_realdev_mega_handling: "Megastructure Speed"		
		realdev_megastructure_build_ignore_desc: "Realistic Development handles Megastructure Build Speed as part of making the game more realistic. This can be disabled, if you either don't want it, or prefer to use just another method."
		
		roci_fe_buildings: "Fallen Empire Buildings"
		roci_fe_buildings_desc: "This module allows access to all FE buildings, not just at most 4."
		roci_fe_buildings_disabled: "Fallen Empire Buildings is disabled pending a rework for 4.0"
		
		roci_trade_routes: "Cargo Ships"
		roci_trade_routes_desc: "This module adds Cargo Ships, which can be used to set up trade routes with other empires, benefitting both target planets.\nThis module has 2 Edicts and 2 Decisions, and does not show up until Colonial Centralization is researched."
		
		roci_shipping: "Shipping Costs"
		roci_shipping_desc: "This module adds a simple Shipping Costs system to planets that have a deficit of resources, requiring energy to represent the cost of shipping in these resources.\nThis module has a planet modifier that updates monthly to show the current cost of shipping to this planet."
		roci_shipping_scaling: "Current Multiplier: [event_target:global_event_country.shipping_scale]"
		roci_shipping_scaling_desc: "The cost of shipping can be scaled by adjusting this setting. It moves in increments of 0.1"
		roci_shipping_scaling_decrease_error: "The cost of shipping cannot be zero. Disable the module if that's what you want."
		shipping_scale: "Shipping Cost"
		
