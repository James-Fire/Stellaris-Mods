	#Concepts
		concept_industrial_production: "Industrial Production"
		concept_industrial_production_desc: "Industrial Production represents your Empire's... industrial production. How much stuff you're actually able to make in a given timeframe. This applies as a realistic-ish limiter on your ability to build various projects, so that planets don't all build at the same speed regardless of development and infrastructure, and you can't necessarily build an unlimited amount of megastructures at once."
		concept_realism_adjustment: "Realism Adjustment"
		concept_realism_adjustment_desc: "Realism Adjustment is how much of a penalty is applied to the speeds of all the build speeds to provide realism where you need IP to actually build things."
		
