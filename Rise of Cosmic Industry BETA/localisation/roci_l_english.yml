	#Origin and Civic
		origin_autofab_tooltip_1:0 "The living standards of your main species will be set to a high standard. Ethic specific ones are used first, then Social Welfare."
		origin_autofab_tooltip_2:0 "You start with an Automatic Factory, and Level 2 Automatic Factory Uplink Buildings in each of the basic resource zones."
		origin_autofab_tooltip_3:0 "You start with less £pop£ Pops, those that would have been working physical resource jobs removed."
		origin_autofab_tooltip_4:0 "£pop£ Pop Growth is slower, due to massive societal changes from living a life of luxury."
		origin_autofab_tooltip_5:0 "Using this in combination with the Civic makes the Automatic Factory give a §G10%§! bonus to automated workforce."
		roci_origin_autofab:0 "Factory Automation"
		roci_origin_autofab_desc:0 "Ever since the Industrial Revolution, this species has been obsessed with increasing automation in their factories. Achieving fully automatic factories, in operation and expansion, has allowed them to greatly reduce the labour required by their species, and catapult themselves to spacefaring before the expected population levels."
		origin_tooltip_autofab_effects:0 "- $origin_autofab_tooltip_1$ \n- $origin_autofab_tooltip_2$ \n- $origin_autofab_tooltip_3$ \n- $origin_autofab_tooltip_4$ \n- $origin_autofab_tooltip_5$\n- $autofab_script_replace$"
		
		roci_civic_autofab_tooltip_1:0 "Workers are unhappy in their occupation, as the population is ready to transfer production over to Automatic Factory Modules."
		roci_civic_autofab_tooltip_2:0 "If taken as a starting civic: You start with an Automatic Factory, and Level 1 Automatic Factory Uplink Buildings in each of the basic resource zones."
		roci_civic_autofab_tooltip_3:0 "Using this in combination with an Origin that gives you the Automatic Factory, the Automatic Factory give a §G10%§! bonus to automated workforce."
		civic_tooltip_autofab_effects:0 "- $roci_civic_autofab_tooltip_1$ \n- $roci_civic_autofab_tooltip_2$ \n- $roci_civic_autofab_tooltip_3$\n- $autofab_script_replace$"
		roci_civic_autofab_desc: "Having recently achieved Automated Factory production, our society is ready to give up their burden."
		roci_civic_autofab:0 "Factory Automation"
		
