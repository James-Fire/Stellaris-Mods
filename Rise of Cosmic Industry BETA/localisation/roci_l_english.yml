		concept_trade_value_ip: "Trade Value"
		concept_trade_value_ip_desc: "IP from Trade Value, at a 1:20 ratio.\n\nIf you have the Megacorp Construction Company civic, you also get 1IP for every 40TV all your Commercial Pact partners have.\n\nIf one of your Commercial Pact partners has the Megacorp Construction Company civic, then you get 1IP for every 40TV they have.\n\nThis also includes IP produced by your Branch Offices and their Buildings."
		concept_buildings_ip: "Buildings"
		concept_buildings_ip_desc: "Capital Planets get 20 Industrial Production for being the Capital.\n\nCapital Buildings provide 10 Industrial Production per level past the first, with the Reassembled Ship Shelter providing 5.\n\nEquipment Factories produce 20 Industrial Production per level."
		concept_construction_ship_ip: "Construction Ships"
		concept_construction_ship_ip_desc: "Each planet with at least 1 Construction Ship in orbit gets 25 flat, and +10% IP produced."

